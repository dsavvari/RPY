name: CMake CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install clang-format
        run: python -m pip install clang-format==20.1.8

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-tidy

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON

      - name: Check formatting
        run: clang-format --dry-run --Werror src/*.cpp src/*.h tests/*.cpp

      - name: Build
        run: cmake --build build --parallel 2

      - name: Lint
        run: cmake --build build --target rpy_lint

      - name: Test
        run: ctest --test-dir build --output-on-failure
